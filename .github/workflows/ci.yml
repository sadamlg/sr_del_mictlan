name: CI

on:
  pull_request:
    branches:
      - develop
      - main
  push:
    branches:
      - develop
      - main

permissions:
  contents: read

jobs:
  frontend-checks:
    name: Frontend checks
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Set up Node.js
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 24.21.0
          package-manager-cache: false
      - name: Install dependencies
        run: npm ci
        working-directory: frontend
      - name: Audit dependencies
        run: npm audit --audit-level=high
        working-directory: frontend
      - name: Run tests
        run: npm test
        working-directory: frontend
      - name: Run ESLint
        run: npm run lint
        working-directory: frontend
      - name: Build frontend
        run: npm run build
        env:
          NEXT_PUBLIC_TURNSTILE_SITE_KEY: phase09-ci-mock-turnstile-site-key
        working-directory: frontend
      - name: Build production frontend image
        run: >-
          docker build
          --file frontend/Dockerfile.production
          --tag phase09-frontend-production-check
          --build-arg MEDIA_BASE_URL=https://media.example.test
          --build-arg NEXT_PUBLIC_TURNSTILE_SITE_KEY=phase09-ci-mock-turnstile-site-key
          frontend
      - name: Install Chromium for Playwright
        run: npx playwright install --with-deps chromium
        working-directory: frontend
      - name: Run browser and accessibility smoke tests
        run: npm run test:e2e
        env:
          PLAYWRIGHT_USE_PRODUCTION: true
        working-directory: frontend
      - name: Verify explicit public indexing opt-in
        env:
          ROBOTS_INDEXABLE: true
          PLAYWRIGHT_USE_PRODUCTION: true
        run: "npm run test:e2e -- --grep='indexación: sólo se permite con opt-in'"
        working-directory: frontend

  backend-checks:
    name: Backend checks
    runs-on: ubuntu-latest
    env:
      DATABASE_URL: postgresql://test:test@127.0.0.1:5432/test
    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Set up Node.js
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 24.21.0
          package-manager-cache: false
      - name: Install dependencies
        run: npm ci
        working-directory: backend
      - name: Audit dependencies
        run: npm audit --audit-level=high
        working-directory: backend
      - name: Run tests
        run: npm test
        working-directory: backend
      - name: Run ESLint
        run: npm run lint
        working-directory: backend
      - name: Validate Prisma schema
        run: npm run prisma:validate
        working-directory: backend
      - name: Generate Prisma Client
        run: npm run prisma:generate
        working-directory: backend

  database-integration:
    name: Database integration
    runs-on: ubuntu-latest
    env:
      COMPOSE_PROJECT_NAME: phase09-ci-${{ github.run_id }}-${{ github.run_attempt }}
      POSTGRES_DB: phase09_test
      POSTGRES_USER: phase09_test
      POSTGRES_PASSWORD: phase09_ci_only
      DATABASE_URL: postgresql://phase09_test:phase09_ci_only@postgres:5432/phase09_test
      POSTGRES_PORT: 25432
      MAILPIT_PORT: 28025
      BACKEND_PORT: 25400
    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Build isolated backend image
        run: docker compose -f compose.yaml -f compose.phase09.yaml build backend
      - name: Start isolated PostgreSQL, Mailpit and API
        run: >-
          docker compose -f compose.yaml -f compose.phase09.yaml
          up --detach --wait --wait-timeout 180 postgres mailpit backend
      - name: Run PostgreSQL integration tests
        run: >-
          docker compose -f compose.yaml -f compose.phase09.yaml
          exec -T -e CART_DATABASE_TEST=1 -e CHECKOUT_DATABASE_TEST=1
          -e EMAIL_DELIVERY_DATABASE_TEST=1 backend npm run test:db
      - name: Verify isolated PostgreSQL backup and restore
        run: bash scripts/test-backup-roundtrip.sh
      - name: Show service logs after failure
        if: failure()
        run: docker compose -f compose.yaml -f compose.phase09.yaml logs --no-color
      - name: Remove isolated test services and data
        if: always()
        run: docker compose -f compose.yaml -f compose.phase09.yaml down --volumes --remove-orphans
